[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sync-client",
    "crates/mcp-server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Roma"]

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
romsidian-core = { path = "crates/core" }
romsidian-sync = { path = "crates/sync-client" }
